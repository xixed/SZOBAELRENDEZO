<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szoba elrendező</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</head>
<body>
    <div id="room-container" class="room-container">
        <h1 class="display-1">Add meg a szoba méreteit maximum 1 tizedesjegy pontosan:</h1>
        <br>
        <div class="input-group">
            <input class="form-control"  type="number" id="room_width" placeholder="Szoba szélessége(cm)" step="0.1" min="0">
            
            <input class="form-control" type="number" id="room_height" placeholder="Szoba hosszúsága(cm)" step="0.1" min="0">
            
            <button id="room_submit" class="btn btn-info" onclick="room_create()" disabled>Küldés</button>
        </div>
    </div>

    <h2 id="room_title" class="room_title">Szoba:</h2>
    <div id="grid-container" class="grid-container mb-4 "></div>
    
    <script src="main.js"></script>
</body>
</html>
